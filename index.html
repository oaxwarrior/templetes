<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara de Asistencia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; }
        #instruccion { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #333; }
        #error-msg { color: red; font-weight: bold; margin-top: 20px; }
        video { background: #000; border-radius: 10px; margin-bottom: 15px; }
        canvas { display: none; } 
        button { padding: 15px 20px; font-size: 16px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="instruccion">1/2: Toma una selfie</div>
    <video id="camara" width="100%" height="300" autoplay playsinline muted></video>
    <canvas id="lienzo"></canvas> 
    
    <button id="capturar">Capturar Selfie</button>
    <div id="error-msg"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        const video = document.getElementById('camara');
        const canvas = document.getElementById('lienzo');
        const errorMsg = document.getElementById('error-msg');
        const btnCapturar = document.getElementById('capturar');
        const instruccion = document.getElementById('instruccion');

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = tg.initDataUnsafe?.user?.id || urlParams.get('userid') || "desconocido";

        let fase = 1;
        let blobFrontal = null;
        let streamActual = null;

        function iniciarCamara(modo) {
            // 1. Apagar la cámara actual completamente
            if (streamActual) {
                streamActual.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null; // Limpiar el reproductor de video

            // 2. Esperar medio segundo antes de encender la siguiente cámara
            setTimeout(() => {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: modo } })
                    .then(stream => {
                        streamActual = stream;
                        video.srcObject = stream;
                        video.play();
                    })
                    .catch(err => {
                        // Fallback por si el celular no tiene cámara trasera definida
                        errorMsg.innerHTML = "Error de hardware, intentando cámara por defecto...";
                        navigator.mediaDevices.getUserMedia({ video: true })
                            .then(fallbackStream => {
                                streamActual = fallbackStream;
                                video.srcObject = fallbackStream;
                                video.play();
                            }).catch(e => {
                                errorMsg.innerHTML = "No se pudo iniciar la cámara: " + e.message;
                            });
                    });
            }, 500); 
        }

        // Iniciar con la cámara frontal
        iniciarCamara("user");

        btnCapturar.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const contexto = canvas.getContext('2d');
            contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (fase === 1) {
                canvas.toBlob(function(blob) {
                    blobFrontal = blob;
                    fase = 2;
                    instruccion.innerText = "2/2: Toma foto de tu área de trabajo";
                    btnCapturar.innerText = "Capturar Área y Enviar";
                    iniciarCamara("environment"); // Activa el cambio con la pausa de 500ms
                }, 'image/jpeg', 0.8);
            } 
            else if (fase === 2) {
                btnCapturar.innerText = "Enviando al servidor..."; 
                btnCapturar.disabled = true;
                errorMsg.innerHTML = "";

                canvas.toBlob(function(blobTrasero) {
                    const formData = new FormData();
                    formData.append('foto_frontal', blobFrontal, 'frontal.jpg');
                    formData.append('foto_trasera', blobTrasero, 'trasera.jpg');
                    formData.append('chat_id', chatId);

                    fetch('https://canseko.pythonanywhere.com/upload_foto', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === "ok") {
                            tg.close(); 
                        } else {
                            throw new Error(data.error || "Error desconocido");
                        }
                    })
                    .catch(error => {
                        errorMsg.innerHTML = "Error al subir las fotos.";
                        btnCapturar.innerText = "Reintentar Envío";
                        btnCapturar.disabled = false;
                    });
                }, 'image/jpeg', 0.8);
            }
        });
    </script>
</body>
</html>
