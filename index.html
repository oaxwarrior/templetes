<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara de Asistencia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; }
        #instruccion { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #333; }
        #error-msg { color: red; font-weight: bold; margin-top: 20px; }
        video { background: #000; border-radius: 10px; margin-bottom: 15px; }
        canvas { display: none; } 
        button { padding: 15px 20px; font-size: 16px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="instruccion">Iniciando cámara...</div>
    <video id="camara" width="100%" height="300" autoplay playsinline muted></video>
    <canvas id="lienzo"></canvas> 
    
    <button id="capturar">Capturar y Enviar</button>
    <div id="error-msg"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        const video = document.getElementById('camara');
        const canvas = document.getElementById('lienzo');
        const errorMsg = document.getElementById('error-msg');
        const btnCapturar = document.getElementById('capturar');
        const instruccion = document.getElementById('instruccion');

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = tg.initDataUnsafe?.user?.id || urlParams.get('userid') || "desconocido";
        const modoCamara = urlParams.get('modo') || "frontal"; 

        let streamActual = null; // Variable para guardar el control de la cámara

        if (modoCamara === "trasera") {
            instruccion.innerText = "2/2: Toma foto de tu área de trabajo";
            btnCapturar.innerText = "Capturar Área y Finalizar";
        } else {
            instruccion.innerText = "1/2: Toma tu selfie";
            btnCapturar.innerText = "Capturar Selfie y Continuar";
        }

        setTimeout(() => {
            let restricciones = modoCamara === "trasera" 
                ? { video: { facingMode: "environment" } } 
                : { video: { facingMode: "user" } };

            navigator.mediaDevices.getUserMedia(restricciones)
                .then(stream => {
                    streamActual = stream; // Guardamos el control
                    video.srcObject = stream;
                    video.play();
                })
                .catch(err => {
                    if (modoCamara === "trasera") {
                        navigator.mediaDevices.getUserMedia({ video: true })
                            .then(streamFallback => {
                                streamActual = streamFallback;
                                video.srcObject = streamFallback;
                                video.play();
                            })
                            .catch(e => {
                                errorMsg.innerHTML = "Error al abrir cámara trasera: " + e.message;
                            });
                    } else {
                        errorMsg.innerHTML = "Error al abrir la cámara: " + err.message;
                    }
                });
        }, 800); 

        btnCapturar.addEventListener('click', () => {
            btnCapturar.innerText = "Enviando al servidor..."; 
            btnCapturar.disabled = true;
            errorMsg.innerHTML = "";

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const contexto = canvas.getContext('2d');
            contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(function(blob) {
                const formData = new FormData();
                formData.append('foto', blob, 'foto.jpg');
                formData.append('chat_id', chatId);
                formData.append('tipo', modoCamara); 

                fetch('https://canseko.pythonanywhere.com/upload_foto', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "ok") {
                        // AQUÍ ESTÁ LA MAGIA: Apagamos la cámara a la fuerza antes de salir
                        if (streamActual) {
                            streamActual.getTracks().forEach(track => track.stop());
                        }
                        tg.close(); 
                    } else {
                        throw new Error(data.error || "Error desconocido");
                    }
                })
                .catch(error => {
                    errorMsg.innerHTML = "Error al subir la foto. Intenta de nuevo.";
                    btnCapturar.innerText = "Reintentar Envío";
                    btnCapturar.disabled = false;
                });
            }, 'image/jpeg', 0.8);
        });
    </script>
</body>
</html>
