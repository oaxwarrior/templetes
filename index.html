<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara de Asistencia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; background-color: #f4f4f9; }
        h3 { color: #333; margin-bottom: 5px; }
        .nota { font-size: 14px; color: #666; margin-bottom: 20px; font-style: italic; }
        #error-msg { color: red; font-weight: bold; margin-top: 20px; }
        .btn { display: inline-block; padding: 15px 20px; font-size: 16px; color: white; border: none; border-radius: 8px; cursor: pointer; width: 90%; max-width: 300px; margin: 10px auto; text-transform: uppercase; font-weight: bold; }
        .btn-blue { background: #0088cc; }
        .btn-green { background: #28a745; }
        .btn:disabled { background: #cccccc; cursor: not-allowed; }
        
        /* Ocultamos los verdaderos inputs */
        input[type="file"] { display: none; }
        
        #preview { max-width: 90%; border-radius: 10px; display: none; margin: 15px auto; border: 3px solid #0088cc; }
    </style>
</head>
<body>
    <h3 id="instruccion">Cargando...</h3>
    <div class="nota">Si se abre un menú, selecciona "Cámara"</div>

    <button class="btn btn-blue" id="btn-abrir-camara">📸 Abrir Cámara</button>

    <!-- Usamos el atributo capture en su forma más básica para intentar saltar el bloqueo de Telegram -->
    <input type="file" id="camaraOculta" accept="image/*" capture>

    <img id="preview" alt="Vista previa">

    <button class="btn btn-green" id="btn-enviar" style="display: none;">✅ Enviar al Servidor</button>
    <div id="error-msg"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = tg.initDataUnsafe?.user?.id || urlParams.get('userid') || "desconocido";
        const modoCamara = urlParams.get('modo') || "frontal";

        const instruccion = document.getElementById('instruccion');
        const btnAbrir = document.getElementById('btn-abrir-camara');
        const btnEnviar = document.getElementById('btn-enviar');
        const preview = document.getElementById('preview');
        const errorMsg = document.getElementById('error-msg');
        const camaraOculta = document.getElementById('camaraOculta');

        if (modoCamara === "trasera") {
            instruccion.innerText = "Paso 2/2: Área de trabajo";
        } else {
            instruccion.innerText = "Paso 1/2: Toma tu selfie";
        }

        btnAbrir.addEventListener('click', () => {
            camaraOculta.click();
        });

        camaraOculta.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                const archivo = e.target.files[0];
                preview.src = URL.createObjectURL(archivo);
                preview.style.display = "block"; 
                btnAbrir.innerText = "🔄 Volver a Tomar"; 
                btnEnviar.style.display = "inline-block"; 
                errorMsg.innerHTML = "";
            }
        });

        btnEnviar.addEventListener('click', () => {
            const archivo = camaraOculta.files[0];
            if (!archivo) return;

            btnEnviar.innerText = "Subiendo foto...";
            btnEnviar.disabled = true;
            btnAbrir.style.display = "none";
            errorMsg.innerHTML = "";

            const formData = new FormData();
            formData.append('foto', archivo, 'foto.jpg');
            formData.append('chat_id', chatId);
            formData.append('tipo', modoCamara);

            fetch('https://canseko.pythonanywhere.com/upload_foto', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "ok") {
                    tg.close();
                } else {
                    throw new Error(data.error || "Error desconocido");
                }
            })
            .catch(error => {
                errorMsg.innerHTML = "Error al subir la foto. Intenta de nuevo.";
                btnEnviar.innerText = "✅ Reintentar Envío";
                btnEnviar.disabled = false;
                btnAbrir.style.display = "inline-block";
            });
        });
    </script>
</body>
</html>
