<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara de Asistencia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; }
        #error-msg { color: red; font-weight: bold; margin-top: 20px; }
        video { background: #000; border-radius: 10px; margin-bottom: 15px; }
        button { padding: 15px 20px; font-size: 16px; background: #0088cc; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Toma tu foto</h2>
    <video id="camara" width="100%" height="300" autoplay playsinline muted></video>
    <button id="capturar">Tomar Foto y Enviar</button>
    
    <!-- Aquí mostraremos el error si la cámara falla -->
    <div id="error-msg"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        const video = document.getElementById('camara');
        const errorMsg = document.getElementById('error-msg');

        // Intentar acceder a la cámara frontal del celular
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
                video.play(); // Obliga a Android a reproducir el video en lugar de pausarlo
            })
            .catch(err => {
                // Si falla, escribimos el error en la pantalla del celular
                errorMsg.innerHTML = "Error al abrir cámara: <br>" + err.name + " - " + err.message;
            });

        // Lógica al presionar el botón azul
        document.getElementById('capturar').addEventListener('click', () => {
            tg.sendData("FOTO_TOMADA_EN_VIVO"); // Avisa al bot en Python
            tg.close(); // Cierra la Mini App
        });
    </script>
</body>
</html>
